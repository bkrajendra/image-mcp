[package]
name = "image-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bkrajendra/image-mcp"
description = "A sandboxed image processing MCP server for AI agents."

[dependencies]
anyhow = "1"
image = "0.25"
rmcp = { version = "0.8", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"